# ============================================
# docker-compose.yml - Smart Quiz Generator Full Stack
# ============================================
# Usage:
#   docker-compose up --build          # Start all services
#   docker-compose up -d --build     # Start in background
#   docker-compose down                # Stop all services
#   docker-compose logs -f backend   # View backend logs
#   docker-compose logs -f frontend  # View frontend logs
# ============================================

version: "3.9"

services:
  # ───────────────────────────────────────────
  # Backend API (FastAPI + ML Models)
  # ───────────────────────────────────────────
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: sqg-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - DATABASE_URL=sqlite:///./data/quiz.db
      - MODEL_CACHE_DIR=./models
      - MODEL_NAME=google/flan-t5-base
      - WORKERS=2
    volumes:
      # Persist database and uploaded files
      - ../data:/app/data
      - ../models:/app/models
    networks:
      - sqg-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ───────────────────────────────────────────
  # Frontend (Streamlit)
  # ───────────────────────────────────────────
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: sqg-frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sqg-network
    restart: unless-stopped

  # ───────────────────────────────────────────
  # Optional: Redis Cache (for future scaling)
  # ───────────────────────────────────────────
  # redis:
  #   image: redis:7-alpine
  #   container_name: sqg-redis
  #   ports:
  #     - "6379:6379"
  #   networks:
  #     - sqg-network
  #   restart: unless-stopped

  # ───────────────────────────────────────────
  # Optional: Nginx Reverse Proxy
  # ───────────────────────────────────────────
  # nginx:
  #   image: nginx:alpine
  #   container_name: sqg-nginx
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #   depends_on:
  #     - backend
  #     - frontend
  #   networks:
  #     - sqg-network
  #   restart: unless-stopped

# ───────────────────────────────────────────
# Networks
# ───────────────────────────────────────────
networks:
  sqg-network:
    driver: bridge

# ───────────────────────────────────────────
# Volumes (optional for persistent data)
# ───────────────────────────────────────────
volumes:
  sqg-data:
    driver: local
  sqg-models:
    driver: local